<style>
  :root{
    --bg:#F1EEE6;
    --paper:#FFFFFF;
    --ink:#26313F;
    --ink-soft:#6B7280;
    --line:#E4DFD3;
    --accent:#C1442D;      /* torii vermillion */
    --accent-soft:#F3DAD3;
    --gold:#B98A1E;         /* mustard for meals */
    --gold-soft:#F2E5C4;
    --moss:#5C7A54;         /* done */
    --moss-soft:#DFE9DA;
    --shadow: 0 1px 2px rgba(38,49,63,.06), 0 4px 14px rgba(38,49,63,.06);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom:56px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:14px 14px 0;}

  /* Top bar */
  .topbar{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:2px 2px 12px;}
  .title{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:18px;letter-spacing:.02em;}
  .sync{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;white-space:nowrap;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--moss);flex:none;}
  .dot.busy{background:var(--gold);}
  .dot.err{background:var(--accent);}

  /* Day tabs */
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:none;min-width:58px;padding:8px 6px;border-radius:12px;
    background:var(--paper);border:1px solid var(--line);text-align:center;cursor:pointer;
    transition:transform .15s ease;
  }
  .tab:active{transform:scale(.96);}
  .tab .wd{font-size:11px;color:var(--ink-soft);}
  .tab .num{font-family:'Zen Maru Gothic',sans-serif;font-weight:700;font-size:17px;line-height:1.15;}
  .tab.selected{border-color:var(--ink);}
  .tab.today{background:var(--accent);border-color:var(--accent);}
  .tab.today .wd,.tab.today .num{color:#fff;}

  .backtoday{
    display:none;align-items:center;gap:6px;color:var(--accent);font-size:13px;font-weight:500;
    padding:0 2px 12px;cursor:pointer;
  }
  .backtoday.show{display:flex;}

  /* Day header */
  .dayhead{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 12px;}
  .dayhead h1{font-family:'Zen Maru Gothic',sans-serif;font-size:19px;margin:0;font-weight:700;}
  .dayhead .progress{font-size:12.5px;color:var(--ink-soft);}

  /* Timeline */
  .timeline{position:relative;padding-left:2px;}
  .stop{position:relative;display:flex;gap:12px;padding:0 2px 22px;}
  .stop:last-child{padding-bottom:6px;}
  .railcol{width:14px;flex:none;display:flex;flex-direction:column;align-items:center;}
  .railcol .node{width:12px;height:12px;border-radius:50%;background:var(--paper);border:2.5px solid var(--ink-soft);margin-top:4px;}
  .railcol .line{flex:1;width:2px;background:var(--line);margin-top:2px;}
  .stop.done .railcol .node{background:var(--moss);border-color:var(--moss);}
  .stop.current .railcol .node{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}

  .card{
    flex:1;background:var(--paper);border-radius:var(--radius);padding:0;box-shadow:var(--shadow);
    border:1px solid transparent;overflow:hidden;display:flex;
  }
  .stop.current .card{border-color:var(--accent);}
  
  .photo-wrap{
    width:100px;height:80px;aspect-ratio:auto;background:linear-gradient(135deg,#EDEAE0,#E4DFD1);
    cursor:pointer;flex:none;position:relative;
  }
  .photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-empty{
    width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;color:var(--ink-soft);
  }
  .photo-empty .ic{font-size:14px;opacity:.55;}
  .photo-empty .lbl{font-size:9px;font-weight:700;text-align:center;}
  .photo-empty.loading .ic{opacity:.3;}
  .photo-edit-btn{
    position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
    background:rgba(38,49,63,.55);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:10px;cursor:pointer;backdrop-filter:blur(2px);
  }

  .card-body{padding:9px 11px;flex:1;display:flex;flex-direction:column;}

  .photopanel{padding:8px 11px;display:flex;flex-direction:column;gap:6px;background:#FBFAF7;}
  .photopanel input[type="text"]{
    font-family:inherit;font-size:12px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);
    background:#fff;color:var(--ink);width:100%;
  }
  .photopanel-row{display:flex;gap:6px;align-items:center;}
  .filebtn{
    font-size:11px;font-weight:700;padding:5px 8px;border-radius:6px;border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;
  }
  .filebtn input[type="file"]{display:none;}
  .photopanel-btns{display:flex;gap:6px;justify-content:flex-end;padding-bottom:6px;}

  .daymap{width:100%;height:200px;border-radius:var(--radius);margin-bottom:14px;box-shadow:var(--shadow);
    border:1px solid var(--line);background:#f5f5f5;position:relative;
  }

  .stop.dragging {opacity: 0.5;}
  .stop.drag-over {background: var(--accent-soft); border-radius: 8px; margin: 4px 0;}
  .stop.draggable-stop {cursor: grab;}
  .stop.draggable-stop:active {cursor: grabbing;}
  .card-main{min-width:0;}
  .time{font-size:11.5px;color:var(--accent);font-weight:700;margin-bottom:2px;}
  .name{font-size:15px;font-weight:700;line-height:1.35;word-break:break-word;}
  .stop.done .name{color:var(--ink-soft);text-decoration:line-through;font-weight:500;}
  .note{font-size:12.5px;color:var(--ink-soft);margin-top:4px;line-height:1.5;}
  .tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:100px;background:var(--gold-soft);color:var(--gold);font-weight:700;margin-bottom:4px;}
  .curtag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:100px;background:var(--accent);color:#fff;font-weight:700;margin-bottom:4px;}

  .actions{display:flex;gap:6px;flex:none;}
  .iconbtn{
    width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--paper);
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);font-size:14px;
    flex:none;
  }
  .iconbtn.check{color:var(--moss);}
  .stop.done .iconbtn.check{background:var(--moss);color:#fff;border-color:var(--moss);}
  .iconbtn:active{transform:scale(.92);}

  .editbox{margin-top:8px;display:flex;flex-direction:column;gap:6px;}
  .editbox input, .editbox textarea{
    font-family:inherit;font-size:13.5px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);
    background:#FBFAF7;color:var(--ink);width:100%;
  }
  .editbox textarea{resize:vertical;min-height:40px;}
  .editrow{display:flex;gap:6px;}
  .editrow input.timein{max-width:90px;}
  .editbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:2px;}
  .btn{font-size:12.5px;padding:6px 12px;border-radius:8px;border:none;cursor:pointer;font-weight:700;}
  .btn.save{background:var(--ink);color:#fff;}
  .btn.cancel{background:transparent;color:var(--ink-soft);}

  .addbar{padding:6px 2px 30px;}
  .addbtn{
    width:100%;padding:11px;border-radius:12px;border:1.5px dashed var(--line);background:transparent;
    color:var(--ink-soft);font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .addbtn:active{transform:scale(.99);}

  .footnote{max-width:640px;margin:0 auto;padding:0 16px 24px;font-size:11.5px;color:var(--ink-soft);line-height:1.6;text-align:center;}

  /* name modal */
  .modal-bg{position:fixed;inset:0;background:rgba(38,49,63,.4);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--paper);border-radius:16px;padding:22px;max-width:320px;width:100%;text-align:center;box-shadow:var(--shadow);}
  .modal h2{font-family:'Zen Maru Gothic',sans-serif;font-size:16px;margin:0 0 6px;}
  .modal p{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;line-height:1.6;}
  .modal input{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--line);font-size:14px;margin-bottom:12px;font-family:inherit;}
  .modal .btn.save{width:100%;padding:10px;font-size:14px;}
</style>
</head>

function normalizeState(st){
  Object.values(st.days).forEach(day=>{
    day.stops.forEach(s=>{
      if(!s.photo){ s.photo = {url:'', wiki: WIKI_MAP[s.name] || ''}; }
      if(typeof s.photo.url !== 'string') s.photo.url = '';
      if(typeof s.photo.wiki !== 'string') s.photo.wiki = WIKI_MAP[s.name] || '';
    });
  });
  return st;
}

let state = null;
let selectedDay = null;
let editingId = null;
let addingOpen = false;
let inputFocused = false;
let myName = '';
let photoEditingId = null;
let draggedStopId = null;  // 追蹤正在拖曳的 stop
const photoLoading = new Set();

const STORAGE_KEY = 'trip-data';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxCqzmxBFapH5Gufq0HfS_b2HtYV4gbhvKR4xmMjnIILj1eaudyyRfZFx96UlXLCd4D/exec';

async function init(){
  myName = await getMyName();
  await loadFromServer(true);
  selectedDay = computeTodayId();
  render();
  hydratePhotos();
  setInterval(poll, 6000);
}

function getMyName(){
  return new Promise(async (resolve)=>{
    try{
      const saved = localStorage.getItem('display-name');
      if(saved){ resolve(saved); return; }
    }catch(e){}
    showNameModal(resolve);
  });
}

function showNameModal(resolve){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">
    <h2>你是誰？</h2>
    <p>方便旅伴知道是誰更新了行程（例如：媽媽、阿光）。之後不會再問一次。</p>
    <input id="nameInput" placeholder="輸入你的稱呼" maxlength="10">
    <button class="btn save" id="nameSaveBtn">開始使用</button>
  </div>`;
  document.body.appendChild(bg);
  const input = bg.querySelector('#nameInput');
  input.focus();
  const save = async ()=>{
    const v = (input.value || '旅伴').trim() || '旅伴';
    try{ localStorage.setItem('display-name', v); }catch(e){}
    document.body.removeChild(bg);
    resolve(v);
  };
  bg.querySelector('#nameSaveBtn').onclick = save;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') save(); });
}

async function loadFromServer(isInitial){
  setSyncStatus('busy');
  try{
    const response = await fetch(APPS_SCRIPT_URL + '?action=load');
    const result = await response.json();
    
    if(result && typeof result === 'object' && result.updatedAt){
      state = normalizeState(result);
    } else {
      state = defaultData();
      await saveToServer();
    }
    setSyncStatus('ok');
  }catch(e){
    console.warn('Load from Sheet failed:', e);
    if(isInitial){
      state = defaultData();
      setSyncStatus('offline');
    } else {
      setSyncStatus('offline');
    }
  }
}

async function saveToServer(){
  try{
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      payload: new URLSearchParams({
        action: 'save',
        data: JSON.stringify(state)
      })
    });
  }catch(e){
    console.warn('Save to Sheet failed:', e);
  }
}

async function poll(){
  if(inputFocused || editingId || addingOpen) return; // don't clobber active typing
  const prevUpdatedAt = state ? state.updatedAt : 0;
  await loadFromServer(false);
  if(state && state.updatedAt !== prevUpdatedAt){
    render();
    hydratePhotos();
  }
}

async function persist(){
  state.updatedAt = Date.now();
  state.updatedBy = myName;
  setSyncStatus('busy');
  try{
    const response = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      payload: new URLSearchParams({
        action: 'save',
        data: JSON.stringify(state)
      })
    });
    const result = await response.json();
    if(result.status === 'ok'){
      setSyncStatus('ok');
    } else {
      setSyncStatus('offline');
    }
  }catch(e){
    console.warn('Persist failed:', e);
    setSyncStatus('offline');
  }
}

function setSyncStatus(status){
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  if(!dot) return;
  dot.className = 'dot' + (status==='busy' ? ' busy' : status==='offline' ? ' err' : '');
  if(status==='busy') txt.textContent = '同步中…';
  else if(status==='offline') txt.textContent = '💾 本機操作中（存儲不可用）';
  else {
    const t = new Date(state.updatedAt);
    const hh = String(t.getHours()).padStart(2,'0');
    const mm = String(t.getMinutes()).padStart(2,'0');
    txt.textContent = (state.updatedBy ? state.updatedBy+'．' : '') + hh+':'+mm+' 已同步';
  }
}

function computeTodayId(){
  const now = new Date();
  const todayStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  let idx = DAY_META.findIndex(d=>d.date === todayStr);
  if(idx === -1){
    if(todayStr < DAY_META[0].date) idx = 0;
    else idx = DAY_META.length-1;
  }
  return DAY_META[idx].id;
}

function fmtDate(dateStr){
  const [y,m,d] = dateStr.split('-');
  return `${parseInt(m)}/${parseInt(d)}`;
}

function currentMinutes(){
  const n = new Date();
  return n.getHours()*60 + n.getMinutes();
}
function toMinutes(t){
  if(!t) return null;
  const [h,m] = t.split(':').map(Number);
  return h*60+m;
}

function render(){
  renderTabs();
  renderBackToday();
  renderDay();
}

function renderTabs(){
  const todayId = computeTodayId();
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = DAY_META.map(d=>{
    const isToday = d.id===todayId;
    const isSel = d.id===selectedDay;
    return `<div class="tab ${isToday?'today':''} ${isSel?'selected':''}" data-day="${d.id}">
      <div class="wd">${d.wd}</div>
      <div class="num">${fmtDate(d.date)}</div>
    </div>`;
  }).join('');
  tabs.querySelectorAll('.tab').forEach(el=>{
    el.onclick = ()=>{ selectedDay = el.dataset.day; editingId=null; addingOpen=false; photoEditingId=null; render(); hydratePhotos(); };
  });
}

function renderBackToday(){
  const todayId = computeTodayId();
  const btn = document.getElementById('backToday');
  if(selectedDay !== todayId){
    btn.classList.add('show');
    btn.onclick = ()=>{ selectedDay = todayId; render(); hydratePhotos(); };
  } else {
    btn.classList.remove('show');
  }
}

function renderDay(){
  const meta = DAY_META.find(d=>d.id===selectedDay);
  const day = state.days[selectedDay];
  document.getElementById('dayTitle').textContent = `${fmtDate(meta.date)}（${meta.wd}）${day.title}`;
  const doneCount = day.stops.filter(s=>s.done).length;
  document.getElementById('dayProgress').textContent = `${doneCount}/${day.stops.length} 完成`;

  const isToday = meta.id === computeTodayId();
  let currentStopId = null;
  if(isToday){
    const nowMin = currentMinutes();
    const upcoming = day.stops
      .map((s,i)=>({...s, idx:i, mins: toMinutes(s.time)}))
      .filter(s=>!s.done && s.mins!==null && s.mins >= nowMin-30);
    if(upcoming.length){
      upcoming.sort((a,b)=>a.mins-b.mins);
      currentStopId = upcoming[0].id;
    } else {
      const next = day.stops.find(s=>!s.done);
      if(next) currentStopId = next.id;
    }
  }

  const tl = document.getElementById('timeline');
  tl.innerHTML = day.stops.map((s,i)=>{
    const isLast = i===day.stops.length-1;
    const isCurrent = s.id===currentStopId;
    const isEditing = editingId === s.id;
    return `
    <div class="stop draggable-stop ${s.done?'done':''} ${isCurrent?'current':''}" data-id="${s.id}" draggable="true">
      <div class="railcol">
        <div class="node"></div>
        ${isLast?'':'<div class="line"></div>'}
      </div>
      <div class="card">
        <div class="card-body">
          ${isEditing ? renderEditBox(s) : `
          <div class="card-top">
            <div class="card-main">
              ${isCurrent?'<span class="curtag">現在</span>':''}
              ${s.tag?`<span class="tag">${escapeHtml(s.tag)}</span>`:''}
              ${s.time?`<div class="time">${escapeHtml(s.time)}</div>`:''}
              <div class="name">${escapeHtml(s.name)||'（未命名地點）'}</div>
              ${s.note?`<div class="note">${escapeHtml(s.note)}</div>`:''}
            </div>
            <div class="actions">
              <div class="iconbtn check" data-act="toggle">${s.done?'✓':''}</div>
              <div class="iconbtn" data-act="edit">✎</div>
              <div class="iconbtn" data-act="del">×</div>
            </div>
          </div>`}
          ${photoEditingId===s.id ? renderPhotoPanel(s) : ''}
        </div>
        ${renderPhotoWrap(s)}
      </div>
    </div>`;
  }).join('');

  tl.querySelectorAll('.stop').forEach(el=>{
    const id = el.dataset.id;
    const stop = day.stops.find(s=>s.id===id);
    const toggleBtn = el.querySelector('[data-act="toggle"]');
    const editBtn = el.querySelector('[data-act="edit"]');
    const delBtn = el.querySelector('[data-act="del"]');
    
    if(toggleBtn) toggleBtn.onclick = ()=>{ stop.done = !stop.done; persist(); render(); initDayMap(); };
    if(editBtn) editBtn.onclick = ()=>{ editingId = id; render(); focusEditName(); };
    if(delBtn) delBtn.onclick = ()=>{
      if(confirm('刪除「'+(stop.name||'這個地點')+'」？')){
        day.stops = day.stops.filter(s=>s.id!==id);
        persist(); editingId=null; render(); initDayMap();
      }
    };

    // --- 拖曳事件 ---
    el.addEventListener('dragstart', (e)=>{
      draggedStopId = id;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });

    el.addEventListener('dragover', (e)=>{
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if(draggedStopId !== id){
        el.classList.add('drag-over');
      }
    });

    el.addEventListener('dragleave', (e)=>{
      el.classList.remove('drag-over');
    });

    el.addEventListener('drop', (e)=>{
      e.preventDefault();
      el.classList.remove('drag-over');
      if(draggedStopId && draggedStopId !== id){
        const draggedIdx = day.stops.findIndex(s=>s.id===draggedStopId);
        const dropIdx = day.stops.findIndex(s=>s.id===id);
        if(draggedIdx !== -1 && dropIdx !== -1){
          const dragged = day.stops[draggedIdx];
          day.stops.splice(draggedIdx, 1);
          day.stops.splice(dropIdx, 0, dragged);
          draggedStopId = null;
          persist(); render(); initDayMap();
        }
      }
    });

    el.addEventListener('dragend', (e)=>{
      el.classList.remove('dragging');
      draggedStopId = null;
    });

    if(editingId===id){
      const saveBtn = el.querySelector('[data-act="save"]');
      const cancelBtn = el.querySelector('[data-act="cancel"]');
      const timeIn = el.querySelector('.editTime');
      const nameIn = el.querySelector('.editName');
      const tagIn = el.querySelector('.editTag');
      const noteIn = el.querySelector('.editNote');
      [timeIn,nameIn,tagIn,noteIn].forEach(inp=>{
        inp.addEventListener('focus',()=>inputFocused=true);
        inp.addEventListener('blur',()=>inputFocused=false);
      });
      saveBtn.onclick = ()=>{
        stop.time = timeIn.value.trim();
        stop.name = nameIn.value.trim();
        stop.tag = tagIn.value.trim();
        stop.note = noteIn.value.trim();
        editingId = null; inputFocused=false;
        persist(); render(); initDayMap();
      };
      cancelBtn.onclick = ()=>{ editingId=null; inputFocused=false; render(); };
    }

    // --- photo controls ---
    const photoOpenEls = el.querySelectorAll('[data-act="photoOpen"]');
    photoOpenEls.forEach(pe=>{ pe.onclick = (ev)=>{ ev.stopPropagation(); photoEditingId = id; render(); }; });

    if(photoEditingId===id){
      const urlInput = el.querySelector('.photoUrlInput');
      const fileInput = el.querySelector('.photoFileInput');
      const urlSaveBtn = el.querySelector('[data-act="photoUrlSave"]');
      const cancelBtn = el.querySelector('[data-act="photoCancel"]');
      const removeBtn = el.querySelector('[data-act="photoRemove"]');
      if(urlInput){
        urlInput.addEventListener('focus',()=>inputFocused=true);
        urlInput.addEventListener('blur',()=>inputFocused=false);
      }
      if(urlSaveBtn) urlSaveBtn.onclick = ()=>{
        const v = urlInput.value.trim();
        if(v){
          stop.photo = {url:v, wiki:''};
          photoEditingId = null; inputFocused=false;
          persist(); render();
        }
      };
      if(cancelBtn) cancelBtn.onclick = ()=>{ photoEditingId=null; inputFocused=false; render(); };
      if(removeBtn) removeBtn.onclick = ()=>{
        stop.photo = {url:'', wiki:''};
        photoEditingId=null;
        persist(); render();
      };
      if(fileInput) fileInput.onchange = (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        compressImageFile(file, 640, 0.62).then(dataUrl=>{
          stop.photo = {url:dataUrl, wiki:''};
          photoEditingId = null;
          persist(); render();
        }).catch(()=>{ alert('照片讀取失敗，換一張試試'); });
      };
    }
  });

  // 初始化地圖（延遲以確保 Leaflet 載入完畢）
  setTimeout(initDayMap, 200);
}


function compressImageFile(file, maxWidth, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function fetchWikiThumb(title){
  try{
    const res = await fetch('https://ja.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(title));
    if(!res.ok) return null;
    const data = await res.json();
    let src = (data.thumbnail && data.thumbnail.source) || (data.originalimage && data.originalimage.source);
    if(!src) return null;
    src = src.replace(/\/\d+px-/, '/640px-');
    return src;
  }catch(e){
    return null;
  }
}

async function hydratePhotos(){
  const day = state.days[selectedDay];
  const targets = day.stops.filter(s=>s.photo && s.photo.wiki && !s.photo.url && !photoLoading.has(s.id));
  if(!targets.length) return;
  targets.forEach(s=>photoLoading.add(s.id));
  render();
  let changed = false;
  await Promise.all(targets.map(async s=>{
    const url = await fetchWikiThumb(s.photo.wiki);
    photoLoading.delete(s.id);
    if(url){ s.photo.url = url; changed = true; }
  }));
  render();
  if(changed) persist();
}

async function waitForLeaflet(maxWait=3000){
  const start = Date.now();
  while(typeof L === 'undefined' && Date.now()-start < maxWait){
    await new Promise(r=>setTimeout(r, 100));
  }
  return typeof L !== 'undefined';
}

function haversineDistance(lat1, lon1, lat2, lon2){
  const R = 6371; // km
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) + 
            Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*
            Math.sin(dLon/2)*Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function estimateDrivingTime(dist){
  // 假設日本高速公路平均速度 80 km/h，市區 30 km/h
  // 簡化為平均 50 km/h
  const hours = dist / 50;
  const mins = Math.round(hours * 60);
  if(mins < 5) return '5分';
  return (mins < 60) ? `${mins}分` : `${Math.floor(mins/60)}h${mins%60}分`;
}

async function initDayMap(){
  const mapEl = document.getElementById('daymap');
  if(!mapEl) return;
  
  // 等待 Leaflet 載入
  if(typeof L === 'undefined'){
    mapEl.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-soft);font-size:13px;">地圖庫載入中…</div>';
    const loaded = await waitForLeaflet(5000);
    if(!loaded){
      mapEl.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-soft);font-size:13px;">地圖庫載入失敗</div>';
      return;
    }
  }

  try {
    // 清除舊地圖
    if(window.dayMapInstance){
      window.dayMapInstance.remove();
      window.dayMapInstance = null;
    }

    const day = state.days[selectedDay];
    const meta = DAY_META.find(d=>d.id===selectedDay);
    const isToday = meta.id === computeTodayId();
    let currentStopId = null;
    if(isToday){
      const nowMin = currentMinutes();
      const upcoming = day.stops
        .map((s,i)=>({...s, idx:i, mins: toMinutes(s.time)}))
        .filter(s=>!s.done && s.mins!==null && s.mins >= nowMin-30);
      if(upcoming.length){
        upcoming.sort((a,b)=>a.mins-b.mins);
        currentStopId = upcoming[0].id;
      } else {
        const next = day.stops.find(s=>!s.done);
        if(next) currentStopId = next.id;
      }
    }

    const stops = day.stops.filter(s=>{
      const coords = LOCATION_COORDS[s.name];
      return coords && coords[0] && coords[1];
    });

    if(stops.length < 2){
      mapEl.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-soft);font-size:13px;">這天沒有地點資訊</div>';
      return;
    }

    const coords = stops.map(s=>LOCATION_COORDS[s.name]);
    const latitudes = coords.map(c=>c[0]);
    const longitudes = coords.map(c=>c[1]);
    const minLat = Math.min(...latitudes);
    const maxLat = Math.max(...latitudes);
    const minLon = Math.min(...longitudes);
    const maxLon = Math.max(...longitudes);
    const centerLat = (minLat + maxLat) / 2;
    const centerLon = (minLon + maxLon) / 2;

    // 初始化 Leaflet 地圖
    const map = L.map(mapEl).setView([centerLat, centerLon], 10);
    window.dayMapInstance = map;

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 19,
    }).addTo(map);

    // 繪製路線和 marker
    const latlngs = coords.map(c=>[c[0], c[1]]);
    const polyline = L.polyline(latlngs, {
      color: '#C1442D',
      weight: 3,
      opacity: 0.7,
      dashArray: '5,5',
    }).addTo(map);

    // 為每個景點添加 marker 和彈窗
    stops.forEach((s, idx)=>{
      const nextStop = stops[idx+1];
      const distToNext = nextStop ? haversineDistance(coords[idx][0], coords[idx][1], coords[idx+1][0], coords[idx+1][1]) : 0;
      const timeToNext = distToNext ? estimateDrivingTime(distToNext) : '';
      
      const circleColor = s.done ? '#5C7A54' : (s.id===currentStopId ? '#C1442D' : '#6B7280');
      const marker = L.circleMarker([coords[idx][0], coords[idx][1]], {
        radius: 8,
        fillColor: circleColor,
        color: circleColor,
        weight: 2,
        opacity: 0.8,
        fillOpacity: 0.7,
      }).addTo(map);

      let popupText = `<strong>${escapeHtml(s.name)}</strong>`;
      if(s.time) popupText += `<br><span style="font-size:11px;color:#999;">${escapeHtml(s.time)}</span>`;
      if(timeToNext) popupText += `<br><span style="font-size:11px;color:#C1442D;font-weight:bold;">→ ${timeToNext}</span>`;
      
      marker.bindPopup(popupText);
    });

    // 自動縮放到顯示所有 marker
    map.fitBounds(L.latLngBounds(latlngs), {padding: [20, 20]});
  } catch(e) {
    console.error('Map initialization failed:', e);
    mapEl.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--ink-soft);font-size:13px;">地圖載入失敗</div>';
  }
}

}

function renderPhotoPanel(s){
  return `<div class="photopanel">
    <input type="text" class="photoUrlInput" placeholder="貼上圖片網址 https://..." value="">
    <div class="photopanel-row">
      <label class="filebtn">📷 從相簿選擇<input type="file" accept="image/*" class="photoFileInput"></label>

    </div>
    <div class="photopanel-btns">
      ${s.photo && s.photo.url ? '<button class="btn cancel" data-act="photoRemove">移除照片</button>' : ''}
      <button class="btn cancel" data-act="photoCancel">取消</button>
      <button class="btn save" data-act="photoUrlSave">套用網址</button>
    </div>
  </div>`;
}

function renderEditBox(s){
  return `<div class="editbox">
    <div class="editrow">
      <input class="timein editTime" placeholder="時間 09:00" value="${escapeAttr(s.time)}">
      <input class="editTag" placeholder="標籤（午餐/晚餐/住宿）" value="${escapeAttr(s.tag)}">
    </div>
    <input class="editName" placeholder="地點名稱" value="${escapeAttr(s.name)}">
    <textarea class="editNote" placeholder="備註（例如：建議先訂位）">${escapeAttr(s.note)}</textarea>
    <div class="editbtns">
      <button class="btn cancel" data-act="cancel">取消</button>
      <button class="btn save" data-act="save">儲存</button>
    </div>
  </div>`;
}

function focusEditName(){
  setTimeout(()=>{
    const el = document.querySelector('.editName');
    if(el){ el.focus(); inputFocused = true; }
  }, 30);
}

document.getElementById('addBtn').onclick = ()=>{
  const day = state.days[selectedDay];
  const s = {id:cid(), time:'', name:'', note:'', tag:'', done:false, photo:{url:'',wiki:''}};
  day.stops.push(s);
  editingId = s.id;
  addingOpen = true;
  render();
  focusEditName();
  addingOpen = false;
};

function escapeHtml(str){
  return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

init();
</script>
</body>
</html>
